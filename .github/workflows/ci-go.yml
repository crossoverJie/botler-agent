name: ci-go

# Go pipeline for `main`. The TypeScript pipeline (ci.yml) still runs, but only to keep the v1
# reference tree under src/ compiling and tested — it gates nothing in a release.
#
# The path filter must list every input of the coverage gate, not just Go sources: a PR that only
# lowers coverage.baseline.json (or the Makefile target) would otherwise skip the job that enforces
# it and weaken the floor unvalidated. `**.go` already covers scripts/covercheck.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Makefile"
      - "coverage.baseline.json"
      - "scripts/covercheck/**"
      - ".github/workflows/ci-go.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Makefile"
      - "coverage.baseline.json"
      - "scripts/covercheck/**"
      - ".github/workflows/ci-go.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath ./cmd/botler

  coverage:
    # Coverage must be measured with -coverpkg: without it a package only counts the statements its
    # OWN tests reach, so internal/runner/runner.go reports 0% even though dispatch's tests drive it
    # through agentrt/fake. The denominator is ./internal/... (dev tooling under scripts/ and the
    # cmd/ entry wiring are intentionally excluded). Uploaded with the `go` flag; the README badge
    # reads `?flag=go`, so a future TS upload can never move this number.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Codecov needs the base commit to compute patch (PR diff) coverage.
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: test (coverage)
        run: |
          go test -count=1 -covermode=atomic -coverpkg=./internal/... \
            -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: coverage gate
        # A floor, not a target: it fails when a change adds more untested code than it tests.
        # The baseline lives in coverage.baseline.json; raise it with `make cover-update`.
        run: go run ./scripts/covercheck -profile coverage.out -v
      - name: upload to Codecov
        # Pinned by SHA on purpose: codecov's uploader was the target of the 2021 supply-chain
        # attack, so this action never floats on a tag.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go
          # Upload exactly the profile above instead of letting the uploader scan the workspace.
          disable_search: true
          # An upload hiccup (Codecov outage, fork PR without the secret) must not fail the build.
          fail_ci_if_error: false

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs the tags, so a shallow checkout is not enough.
          fetch-depth: 0
      - name: build image
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # Pass the version explicitly: the Dockerfile's "dev" default only covers bare builds
          # (the build context has no .git, so it cannot derive one).
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$COMMIT" \
            -t botler-agent:smoke .
      # Both entries must work WITHOUT a populated DATA_ROOT: `init` and `--version` return before
      # paths.Validate() by design (§2.1.1). If they start failing here, the startup-order contract
      # was broken somewhere.
      - name: version + init
        run: |
          # The stamped version must reach the binary, not silently stay "dev".
          docker run --rm botler-agent:smoke --version | tee /tmp/version.txt
          grep -qF "$VERSION" /tmp/version.txt
          docker run --rm botler-agent:smoke init
      # A real process must come up and answer the health check. The monitor binds 127.0.0.1, so it
      # has to be probed from inside the container; a dummy channel token keeps the process alive.
      - name: live health check
        run: |
          mkdir -p /tmp/smoke/data/proj /tmp/smoke/cfg
          docker run -d --name smoke \
            -v /tmp/smoke/cfg:/config -v /tmp/smoke/data:/data \
            -e DATA_ROOT=/data \
            -e TELEGRAM_BOT_TOKEN=000000:dummy \
            -e WEBUI_ENABLED=0 -e SCHEDULER_ENABLED=0 -e MONITOR_ENABLED=1 \
            botler-agent:smoke
          for i in $(seq 1 30); do
            if docker exec smoke wget -qO- http://127.0.0.1:8899/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
