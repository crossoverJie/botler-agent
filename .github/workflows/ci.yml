name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Codecov needs the base commit to compute patch (PR diff) coverage.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test (coverage)
        # Same tests as `npm test`, run under c8. c8 is required instead of node's built-in
        # reporter: the built-in one silently drops files no test imports, which overstates this
        # tree at ~86% instead of the real ~42%.
        run: npm run cover:lcov

      - name: Upload to Codecov
        # Covers the v1 reference tree (src/) only, under the `ts` flag, so it can never move the
        # `?flag=go` badge that represents the shipped Go implementation. SHA-pinned on purpose:
        # codecov's uploader was the target of the 2021 supply-chain attack.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: ts
          fail_ci_if_error: false

  docker-smoke:
    # Build the production image and actually boot the entrypoint (`botler init` on the static Go
    # binary), so a broken image is caught before publish.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build image (local, no push)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: botler-agent:smoke

      - name: Smoke test entrypoint
        # `init` scaffolds /config and must exit 0; a non-zero exit fails this step.
        run: docker run --rm botler-agent:smoke init
